name: watch-reservation

on:
  schedule:
    # JST 6:00-23:59 に5分おき（cron は UTC）。混雑する毎時0分を避けて3分ずらす
    - cron: "3-58/5 21-23 * * *"
    - cron: "3-58/5 0-14 * * *"
  workflow_dispatch:

concurrency:
  group: watch-reservation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - run: uv run --no-dev python check.py
        env:
          WATCH_DAYS: "21"
          WATCH_UNTIL: "2026-10-14"
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
