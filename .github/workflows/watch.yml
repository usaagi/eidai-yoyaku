name: watch-reservation

on:
  schedule:
    # JST 6:00-23:59 に5分おき（cron は UTC）。GitHub側の混雑で遅れることがある
    - cron: "*/5 21-23 * * *"
    - cron: "*/5 0-14 * * *"
  workflow_dispatch:

concurrency:
  group: watch-reservation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # 前回実行時の空き枠一覧を復元（新規に空いた枠だけ通知するため）
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: uv run --no-dev python check.py
        env:
          WATCH_DAYS: "14"
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}

      - uses: actions/cache/save@v4
        if: success()
        with:
          path: state.json
          key: state-${{ github.run_id }}
